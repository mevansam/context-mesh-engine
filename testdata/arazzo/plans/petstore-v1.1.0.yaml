arazzo: 1.0.1
info:
  title: Pet Store Workflows
  summary: Create and fetch pets
  version: 1.1.0
  x-planId: petstore
sourceDescriptions:
  - name: petstoreApi
    url: ../sources/openapi.yaml
    type: openapi
workflows:
  - workflowId: pingHealth
    summary: Check API health
    inputs:
      type: object
      properties:
        name:
          type: string
    steps:
      - stepId: getHealth
        operationId: getHealth
        successCriteria:
          - condition: $statusCode == 200
  - workflowId: echoName
    summary: Echo a name via health
    inputs:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    steps:
      - stepId: getHealth
        operationId: getHealth
        successCriteria:
          - condition: $statusCode == 200
